name: Deploy to GitHub Pages

on:
  push:
    branches: [ bryn_2025 ]
  # Picks up new commits on the library's main and develop branches
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository using git
        uses: actions/checkout@v4
      - name: Checkout equadratures main
        uses: actions/checkout@v4
        with:
          repository: equadratures/equadratures
          ref: main
          path: stable
      - name: Checkout equadratures develop
        uses: actions/checkout@v4
        with:
          repository: equadratures/equadratures
          ref: develop
          path: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the docs
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install "./stable[docs]"
          DOCS_VERSION=stable sphinx-build -b html stable/docs public/documentation
          pip install "./dev[docs]"
          DOCS_VERSION=dev sphinx-build -b html dev/docs public/documentation/dev
      - name: Install, build, and upload your site
        uses: withastro/action@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
